<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Login — Rental Agent Portal</title><link rel="stylesheet" href="css/portal.css"></head>
<body class="login-body">
<div class="login-card">
<div class="brand">RENTAL <b>AGENT</b></div>
<h1>Agent sign in</h1>
<form id="loginForm">
<input id="phone" required placeholder="Phone number" autocomplete="username">
<input id="pass" required type="password" placeholder="Password" autocomplete="current-password">
<button class="btn primary" type="submit">Sign in</button>
</form>
<div id="loginResult"></div>
<a class="back-link" href="../index.html">← Back to public website</a>
<p class="small-note" style="margin-top:10px">Your login is created automatically once the company approves your agent application — use the portal password supplied by the company after approval.</p>
</div>
<script src="../supabase-config.js"></script><script src="../data.js"></script>
<script>Store.ready.then(()=>{
if (Store.isAgentLoggedIn()) location.href = "index.html";
document.getElementById("loginForm").onsubmit = e => {
  e.preventDefault();
  const u = document.getElementById("phone").value.trim(), p = document.getElementById("pass").value;
  if (Store.loginAgent(u, p)) { location.href = "index.html"; }
  else document.getElementById("loginResult").innerHTML = '<p class="error">No approved agent account matches that phone number / password.</p>';
};
});</script>
</body></html>
