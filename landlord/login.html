<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Landlord Login — Rental Landlord Portal</title><link rel="stylesheet" href="css/portal.css"></head>
<body class="login-body">
<div class="login-card">
<div class="brand">RENTAL <b>LANDLORD</b></div>
<h1>Landlord sign in</h1>
<form id="loginForm">
<input id="phone" required placeholder="Phone number" autocomplete="username">
<input id="pass" required type="password" placeholder="Password" autocomplete="current-password">
<button class="btn primary" type="submit">Sign in</button>
</form>
<div id="loginResult"></div>
<a class="back-link" href="../index.html">← Back to public website</a>
<p class="small-note" style="margin-top:10px">Your login is created automatically once the company approves your landlord application — use the portal password supplied by the company after approval.</p>
</div>
<script src="../supabase-config.js"></script><script src="../data.js"></script><script>
(function(){
 const form=document.getElementById('loginForm'),result=document.getElementById('loginResult'),button=form.querySelector('button'); let readyData=null; const waitForStore=()=>readyData||(readyData=Store.ready.catch(e=>{throw e}));
 waitForStore().then(()=>{if(Store.isLandlordLoggedIn())location.href='index.html?session='+encodeURIComponent(Store.sessionToken());}).catch(()=>{});
 form.onsubmit=async e=>{e.preventDefault();if(button.disabled)return;const u=document.getElementById('phone').value.trim(),p=document.getElementById('pass').value;if(!u||!p){result.innerHTML='<p class="error">Enter your phone number and password.</p>';return}button.disabled=true;button.textContent='Connecting…';result.innerHTML='<p class="muted">Connecting securely to Supabase…</p>';try{await waitForStore();if(await Store.loginLandlord(u,p)){result.innerHTML='<p class="muted">Signed in. Opening dashboard…</p>';location.href='index.html?session='+encodeURIComponent(Store.sessionToken());}else{result.innerHTML='<p class="error">No approved account matches those credentials.</p>';button.disabled=false;button.textContent='Sign in';}}catch(err){result.innerHTML='<p class="error">Supabase login failed. '+Store.escapeHtml(err.message||String(err))+'</p>';button.disabled=false;button.textContent='Sign in';}};
})();
</script></body></html>
