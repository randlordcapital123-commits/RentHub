<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Landlord Login — Rental Landlord Portal</title><link rel="stylesheet" href="css/portal.css"></head>
<body class="login-body">
<div class="login-card">
<div class="brand">RENTAL <b>LANDLORD</b></div>
<h1>Landlord sign in</h1>
<form id="loginForm">
<input id="phone" required placeholder="Phone number" autocomplete="username">
<input id="pass" required type="password" placeholder="Password" autocomplete="current-password">
<button class="btn primary" type="submit">Sign in</button>
</form>
<div id="loginResult"></div>
<a class="back-link" href="../index.html">← Back to public website</a>
<p class="small-note" style="margin-top:10px">Your login is created automatically once the company approves your landlord application — use the portal password supplied by the company after approval.</p>
</div>
<script src="../supabase-config.js"></script><script src="../data.js"></script>
<script>Store.ready.then(()=>{if(Store.isLandlordLoggedIn()){location.href='index.html?session='+encodeURIComponent(Store.sessionToken());return}document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const u=document.getElementById('phone').value.trim(),p=document.getElementById('pass').value;try{if(await Store.loginLandlord(u,p))location.href='index.html?session='+encodeURIComponent(Store.sessionToken());else document.getElementById('loginResult').innerHTML='<p class="error">No approved account matches those credentials.</p>';}catch(err){document.getElementById('loginResult').innerHTML='<p class="error">Supabase login failed. '+Store.escapeHtml(err.message)+'</p>';}}});</script>
</body></html>
