<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — Rental Admin</title><link rel="stylesheet" href="css/admin.css"></head>
<body class="login-body">
<div class="login-card">
<div class="brand">RENTAL <b>ADMIN</b></div>
<h1>Admin sign in</h1>
<form id="loginForm">
<input id="user" name="username" required placeholder="Username" autocomplete="username">
<input id="pass" name="password" required type="password" placeholder="Password" autocomplete="current-password">
<button class="btn primary" type="submit">Sign in</button>
</form>
<div id="loginResult"></div>
<a class="back-link" href="../index.html">← Back to public website</a>
</div>
<script src="../supabase-config.js"></script><script src="../data.js"></script><script>Store.ready.then(()=>{const d=Store.data;const form=document.getElementById('loginForm');const heading=document.querySelector('h1');const note=document.querySelector('.muted');if(!d.settings.username||!d.settings.password){heading.textContent='Create admin account';if(note)note.textContent='First run: create the administrator credentials for this browser.';form.querySelector('button').textContent='Create admin account';form.onsubmit=e=>{e.preventDefault();const f=new FormData(form),u=String(f.get('username')||'').trim(),p=String(f.get('password')||'');if(u.length<3||p.length<8){alert('Use a username of at least 3 characters and a password of at least 8 characters.');return}d.settings.username=u;d.settings.password=p;Store.save();if(Store.login(u,p))location.href='index.html'};}else{form.onsubmit=e=>{e.preventDefault();const f=new FormData(form);if(Store.login(f.get('username'),f.get('password')))location.href='index.html';else alert('Invalid credentials.')}} });</script></body></html>
