<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — Rental Admin</title><link rel="stylesheet" href="css/admin.css"></head>
<body class="login-body">
<div class="login-card">
<div class="brand">RENTAL <b>ADMIN</b></div>
<h1>Admin sign in</h1>
<form id="loginForm">
<input id="user" name="username" required placeholder="Username" autocomplete="username">
<input id="pass" name="password" required type="password" placeholder="Password" autocomplete="current-password">
<button class="btn primary" type="submit">Sign in</button>
</form>
<div id="loginResult"></div>
<a class="back-link" href="../index.html">← Back to public website</a>
</div>
<script src="../supabase-config.js"></script><script src="../data.js"></script><script>
(function(){
  const form=document.getElementById('loginForm'), result=document.getElementById('loginResult'), button=form.querySelector('button'), heading=document.querySelector('h1');
  let readyData=null;
  const waitForStore=()=>readyData||(readyData=Store.ready.catch(e=>{throw e}));
  waitForStore().then(()=>{const d=Store.data;if(!d.settings.username||!d.settings.password){heading.textContent='Create admin account';button.textContent='Create admin account';}}).catch(()=>{});
  form.onsubmit=async e=>{e.preventDefault(); if(button.disabled)return; const f=new FormData(form),u=String(f.get('username')||'').trim(),p=String(f.get('password')||'');
    if(u.length<3||p.length<8){result.innerHTML='<p class="error">Use a username of at least 3 characters and a password of at least 8 characters.</p>';return}
    button.disabled=true;button.textContent='Connecting…';result.innerHTML='<p class="muted">Connecting securely to Supabase…</p>';
    try{await waitForStore();const d=Store.data;if(!d.settings.username||!d.settings.password){d.settings.username=u;d.settings.password=p;await Store.save();}await Store.login(u,p);result.innerHTML='<p class="muted">Signed in. Opening dashboard…</p>';location.href='index.html?session='+encodeURIComponent(Store.sessionToken());}
    catch(err){result.innerHTML='<p class="error">Login failed: '+Store.escapeHtml(err.message||String(err))+'</p>';button.disabled=false;button.textContent=(!Store.data?.settings?.username||!Store.data?.settings?.password)?'Create admin account':'Sign in';}
  };
})();
</script></body></html>
